<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qufu Antigravity Monitor</title>
    <style>*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;
  --qufu-bg: var(--color-background-primary, #ffffff);
  --qufu-bg-subtle: var(--color-background-secondary, #f4f4f5);
  --qufu-bg-hover: var(--color-background-tertiary, #e4e4e7);
  --qufu-fg: var(--color-text-primary, #18181b);
  --qufu-fg-muted: var(--color-text-secondary, #52525b);
  --qufu-fg-subtle: var(--color-text-tertiary, #71717a);
  --qufu-border: var(--color-border-primary, rgba(0, 0, 0, 0.1));
  --qufu-border-subtle: var(--color-border-secondary, rgba(0, 0, 0, 0.06));
  --qufu-ring: var(--color-ring-primary, #3b82f6);
  --qufu-track: rgba(128, 128, 128, 0.18);

  --qufu-green: #16a34a;
  --qufu-yellow: #ca8a04;
  --qufu-red: #dc2626;
  --qufu-unknown: #71717a;

  --qufu-warn-bg: rgba(202, 138, 4, 0.1);
  --qufu-warn-border: rgba(202, 138, 4, 0.28);
  --qufu-warn-fg: #a16207;

  --qufu-err-bg: rgba(220, 38, 38, 0.09);
  --qufu-err-border: rgba(220, 38, 38, 0.28);
  --qufu-err-fg: #b91c1c;

  --qufu-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
}

:root[data-theme="dark"] {
  --qufu-bg: var(--color-background-primary, #141416);
  --qufu-bg-subtle: var(--color-background-secondary, #1c1c20);
  --qufu-bg-hover: var(--color-background-tertiary, #27272c);
  --qufu-fg: var(--color-text-primary, #f4f4f5);
  --qufu-fg-muted: var(--color-text-secondary, #a1a1aa);
  --qufu-fg-subtle: var(--color-text-tertiary, #71717a);
  --qufu-border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
  --qufu-border-subtle: var(--color-border-secondary, rgba(255, 255, 255, 0.06));
  --qufu-track: rgba(255, 255, 255, 0.12);

  --qufu-green: #22c55e;
  --qufu-yellow: #eab308;
  --qufu-red: #ef4444;
  --qufu-unknown: #71717a;

  --qufu-warn-bg: rgba(234, 179, 8, 0.12);
  --qufu-warn-border: rgba(234, 179, 8, 0.3);
  --qufu-warn-fg: #facc15;

  --qufu-err-bg: rgba(239, 68, 68, 0.12);
  --qufu-err-border: rgba(239, 68, 68, 0.3);
  --qufu-err-fg: #f87171;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --qufu-bg: var(--color-background-primary, #141416);
    --qufu-bg-subtle: var(--color-background-secondary, #1c1c20);
    --qufu-bg-hover: var(--color-background-tertiary, #27272c);
    --qufu-fg: var(--color-text-primary, #f4f4f5);
    --qufu-fg-muted: var(--color-text-secondary, #a1a1aa);
    --qufu-fg-subtle: var(--color-text-tertiary, #71717a);
    --qufu-border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
    --qufu-border-subtle: var(--color-border-secondary, rgba(255, 255, 255, 0.06));
    --qufu-track: rgba(255, 255, 255, 0.12);

    --qufu-green: #22c55e;
    --qufu-yellow: #eab308;
    --qufu-red: #ef4444;
    --qufu-unknown: #71717a;

    --qufu-warn-bg: rgba(234, 179, 8, 0.12);
    --qufu-warn-border: rgba(234, 179, 8, 0.3);
    --qufu-warn-fg: #facc15;

    --qufu-err-bg: rgba(239, 68, 68, 0.12);
    --qufu-err-border: rgba(239, 68, 68, 0.3);
    --qufu-err-fg: #f87171;
  }
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--qufu-bg);
  color: var(--qufu-fg);
  font-family: var(--qufu-font);
  font-size: 12px;
  line-height: 1.35;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.monitor {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--qufu-border-subtle);
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex: 1 1 auto;
}

.plan-tag {
  font-size: 11px;
  font-weight: 500;
  color: var(--qufu-fg-muted);
  background: var(--qufu-bg-subtle);
  border: 1px solid var(--qufu-border);
  border-radius: 4px;
  padding: 1px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.interval-select {
  appearance: none;
  background: var(--qufu-bg-subtle);
  color: var(--qufu-fg-muted);
  border: 1px solid var(--qufu-border);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: inherit;
  font-size: 11px;
  line-height: 1.3;
  cursor: pointer;
  outline: none;
}

.interval-select:hover {
  background: var(--qufu-bg-hover);
  color: var(--qufu-fg);
}

.interval-select:focus-visible,
.refresh-btn:focus-visible {
  outline: 1.5px solid var(--qufu-ring);
  outline-offset: 1px;
}

.refresh-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--qufu-border);
  border-radius: 4px;
  background: var(--qufu-bg-subtle);
  color: var(--qufu-fg-muted);
  cursor: pointer;
  transition: background-color 0.12s ease, color 0.12s ease;
}

.refresh-btn:hover:not(:disabled) {
  background: var(--qufu-bg-hover);
  color: var(--qufu-fg);
}

.refresh-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.refresh-icon {
  width: 12px;
  height: 12px;
  display: block;
}

.refresh-btn.loading .refresh-icon {
  animation: qufu-spin 0.8s linear infinite;
}

@keyframes qufu-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.notice {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 7px 9px;
  border-radius: 5px;
  border: 1px solid transparent;
  font-size: 11px;
  line-height: 1.35;
  word-break: break-word;
}

.notice.stale {
  background: var(--qufu-warn-bg);
  border-color: var(--qufu-warn-border);
  color: var(--qufu-warn-fg);
}

.notice.error {
  background: var(--qufu-err-bg);
  border-color: var(--qufu-err-border);
  color: var(--qufu-err-fg);
}

.notice-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
}

.notice-detail {
  opacity: 0.9;
  font-weight: 400;
}

.retry-link {
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  border-radius: 4px;
  padding: 1px 7px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  flex: 0 0 auto;
}

.retry-link:hover {
  opacity: 0.85;
}

.groups {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.group + .group {
  padding-top: 8px;
  border-top: 1px solid var(--qufu-border-subtle);
}

.group-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--qufu-fg-muted);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bucket {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.bucket-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.bucket-label {
  font-size: 11.5px;
  color: var(--qufu-fg);
  white-space: nowrap;
  flex: 0 0 auto;
}

.bucket-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  flex: 0 1 auto;
}

.bucket-reset {
  font-size: 11px;
  color: var(--qufu-fg-subtle);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bucket-pct {
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 34px;
  text-align: right;
  white-space: nowrap;
}

.bucket-pct.green {
  color: var(--qufu-green);
}

.bucket-pct.yellow {
  color: var(--qufu-yellow);
}

.bucket-pct.red {
  color: var(--qufu-red);
}

.bucket-pct.unknown {
  color: var(--qufu-unknown);
}

.bar-track {
  width: 100%;
  height: 5px;
  border-radius: 999px;
  background: var(--qufu-track);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
}

.bar-fill.green {
  background: var(--qufu-green);
}

.bar-fill.yellow {
  background: var(--qufu-yellow);
}

.bar-fill.red {
  background: var(--qufu-red);
}

.bar-fill.unknown {
  background: var(--qufu-unknown);
  width: 0%;
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--qufu-border-subtle);
  font-size: 10.5px;
  color: var(--qufu-fg-subtle);
  font-variant-numeric: tabular-nums;
  min-width: 0;
}

.footer-left,
.footer-right {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
  background: var(--qufu-green);
}

.status-dot.stale {
  background: var(--qufu-yellow);
}

.status-dot.error {
  background: var(--qufu-red);
}

.status-dot.loading {
  background: var(--qufu-fg-subtle);
}

.skeleton {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0;
}

.skeleton-line {
  height: 8px;
  border-radius: 4px;
  background: var(--qufu-track);
}

.skeleton-line.short {
  width: 45%;
}

.hidden {
  display: none !important;
}
</style>
  </head>
  <body>
    <main class="monitor" aria-label="Qufu Antigravity Monitor">
      <header class="toolbar">
        <div class="toolbar-left">
          <span id="plan-tag" class="plan-tag hidden" title="Active subscription plan"></span>
          <span id="title-label" class="group-name">Usage Monitor</span>
        </div>
        <div class="toolbar-right">
          <select id="interval-select" class="interval-select" aria-label="Auto-refresh interval" title="Auto-refresh interval">
            <option value="30">30s</option>
            <option value="60" selected>60s</option>
            <option value="120">2m</option>
            <option value="300">5m</option>
          </select>
          <button id="refresh-btn" class="refresh-btn" type="button" aria-label="Refresh usage quota" title="Refresh now">
            <svg class="refresh-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.62" />
              <path d="M13.5 2.75v2.75h-2.75" />
            </svg>
          </button>
        </div>
      </header>

      <div id="notice-box" class="notice hidden" role="status" aria-live="polite"></div>

      <section id="loading-view" class="skeleton" aria-label="Loading quota data">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line"></div>
      </section>

      <section id="groups-container" class="groups hidden" aria-label="Model quota limits"></section>

      <footer class="footer">
        <span class="footer-left">
          <span id="status-dot" class="status-dot loading" aria-hidden="true"></span>
          <span id="updated-text">Loading...</span>
        </span>
        <span id="next-sync-text" class="footer-right"></span>
      </footer>
    </main>
