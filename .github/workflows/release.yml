name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & test MCP App plugin
        run: |
          npm ci
          npm run build
          npm test

      - name: Package MCP App plugin zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/plugin/assets, release/plugin/dist | Out-Null
          Copy-Item plugin.json, mcp_config.json, README.md, LICENSE release/plugin/
          Copy-Item assets/logo.svg release/plugin/assets/
          Copy-Item dist/mcp-server.mjs, dist/ui.html release/plugin/dist/
          Compress-Archive -Path release/plugin/* -DestinationPath release/qufu-antigravity-monitor-plugin.zip -Force

      - name: Publish Windows Always-on-Top Widget (win-x64)
        shell: pwsh
        run: |
          dotnet publish widget/QufuUsageWidget.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o release/widget
          Copy-Item release/widget/QufuUsageWidget.exe release/QufuAntigravityMonitor-win-x64.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/QufuAntigravityMonitor-win-x64.exe
            release/qufu-antigravity-monitor-plugin.zip
